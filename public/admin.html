<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Call In Control</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>🎛️ Call-In Control Panel</h1>
  <div class="subtitle">Preview waiting callers, then push one live to the DJ screens.</div>

  <div class="card" style="margin-bottom:16px;">
    <div style="font-weight:600; margin-bottom:8px;">📢 Message everyone waiting</div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="broadcastInput" placeholder="e.g. You're up next, stand by!" style="flex:1;" />
      <button class="btn-primary" id="broadcastBtn">Send to All</button>
    </div>
  </div>

  <div id="grid" class="grid"></div>
  <div id="emptyMsg" class="empty-msg">No one is waiting yet. Share your caller link to get started.</div>

  <div class="card" style="margin-top:24px;">
    <div style="font-weight:600; margin-bottom:6px;">Caller link to share:</div>
    <div id="callerLink" style="color:var(--muted); word-break:break-all; font-size:0.9rem;"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/rtc-config.js"></script>
<script>
const socket = io();
socket.emit('register', { role: 'admin' });

document.getElementById('callerLink').textContent = location.origin + '/caller.html';

const rtcConfig = RTC_CONFIG;
const previewPCs = {}; // callerId -> RTCPeerConnection
const talkbackPCs = {}; // callerId -> RTCPeerConnection (solo talk)
let talkbackStream = null;
const tiles = {}; // callerId -> DOM element
let currentList = [];

function setupMeter(stream, meterEl) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    function tick() {
      if (!meterEl.isConnected) return; // tile removed, stop looping
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      meterEl.style.width = Math.min(100, avg * 1.5) + '%';
      requestAnimationFrame(tick);
    }
    tick();
  } catch (e) { /* ignore */ }
}

async function connectPreview(callerId) {
  if (previewPCs[callerId]) return;
  const pc = new RTCPeerConnection(rtcConfig);
  previewPCs[callerId] = pc;

  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.addTransceiver('video', { direction: 'recvonly' });

  pc.onconnectionstatechange = () => {
    const tile = tiles[callerId];
    if (!tile) return;
    const statusText = tile.querySelector('.connState');
    if (statusText) statusText.textContent = friendlyIceStatus(pc.connectionState);
  };

  pc.ontrack = (e) => {
    const tile = tiles[callerId];
    if (!tile) return;
    const video = tile.querySelector('video');
    const stream = e.streams[0];
    if (video.srcObject !== stream) {
      video.srcObject = stream;
      // Browsers block unmuted autoplay - start muted, admin can unmute per tile.
      video.muted = true;
      video.play().catch(() => {});
      const meter = tile.querySelector('.micMeter');
      if (stream.getAudioTracks().length) setupMeter(stream, meter);
      const hasVideo = stream.getVideoTracks().length > 0;
      tile.querySelector('.noVideoNote').style.display = hasVideo ? 'none' : 'block';
    }
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('signal', { to: callerId, data: { type: 'candidate', candidate: e.candidate, purpose: 'preview' } });
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('signal', { to: callerId, data: { type: 'offer', sdp: offer, purpose: 'preview' } });
}

async function toggleTalkback(callerId, btn) {
  if (talkbackPCs[callerId]) {
    talkbackPCs[callerId].close();
    delete talkbackPCs[callerId];
    btn.textContent = '🎧 Solo talk';
    btn.classList.remove('btn-live');
    return;
  }
  try {
    if (!talkbackStream) {
      talkbackStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
  } catch (e) {
    alert('Could not access your microphone for solo talk.');
    return;
  }
  const pc = new RTCPeerConnection(rtcConfig);
  talkbackPCs[callerId] = pc;
  talkbackStream.getTracks().forEach((t) => pc.addTrack(t, talkbackStream));
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('signal', { to: callerId, data: { type: 'candidate', candidate: e.candidate, purpose: 'talkback' } });
    }
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('signal', { to: callerId, data: { type: 'offer', sdp: offer, purpose: 'talkback' } });
  btn.textContent = '🔴 Talking...';
  btn.classList.add('btn-live');
}

socket.on('signal', async ({ from, data }) => {
  const purpose = data.purpose || 'preview';
  const pc = purpose === 'talkback' ? talkbackPCs[from] : previewPCs[from];
  if (!pc) return;
  if (data.type === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
  } else if (data.type === 'candidate') {
    try { await pc.addIceCandidate(data.candidate); } catch (e) {}
  }
});

function renderList(list) {
  currentList = list;
  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('emptyMsg');
  emptyMsg.style.display = list.length ? 'none' : 'block';

  const currentIds = new Set(list.map((c) => c.id));
  // Clean up tiles/connections for callers who left
  Object.keys(tiles).forEach((id) => {
    if (!currentIds.has(id)) {
      tiles[id].remove();
      delete tiles[id];
      if (previewPCs[id]) { previewPCs[id].close(); delete previewPCs[id]; }
      if (talkbackPCs[id]) { talkbackPCs[id].close(); delete talkbackPCs[id]; }
    }
  });

  list.forEach((c) => {
    let tile = tiles[c.id];
    if (!tile) {
      tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `
        <div class="tile-name">
          <span class="callerNameLabel">${escapeHtml(c.name)}</span>
          <span class="status-pill"><span class="dot"></span><span class="statusText">waiting</span></span>
        </div>
        <div class="connState subtitle" style="font-size:0.7rem; margin-bottom:6px;">Connecting…</div>
        <video autoplay playsinline></video>
        <div class="noVideoNote" style="font-size:0.75rem; color:var(--muted); margin-top:4px;">No camera - audio only</div>
        <div style="margin-top:8px;">
          <div style="height:6px; background:#2a2e38; border-radius:3px; overflow:hidden;">
            <div class="micMeter" style="height:100%; width:0%; background:#2ecc71; transition:width 0.1s;"></div>
          </div>
          <div class="subtitle" style="margin-top:4px; font-size:0.7rem;">Mic level</div>
        </div>
        <div class="tile-actions">
          <button class="btn-live goLiveBtn">Go Live</button>
          <button class="btn-stop stopBtn" style="display:none;">Stop</button>
          <button class="btn-ghost unmuteBtn">🔇 Unmute preview</button>
        </div>
        <div class="tile-actions">
          <button class="btn-ghost toggleMicBtn" data-on="true">🎙️ Mic: On</button>
          <button class="btn-ghost toggleCamBtn" data-on="true">📷 Cam: On</button>
        </div>
        <div class="tile-actions">
          <button class="btn-ghost talkBtn">🎧 Solo talk</button>
          <button class="btn-ghost renameBtn">✏️ Rename</button>
        </div>
        <div class="tile-actions">
          <button class="btn-ghost msgBtn">💬 Private message</button>
          <button class="btn-ghost linkBtn">🔗 Copy solo link</button>
        </div>
        <div class="tile-actions">
          <button class="btn-ghost hideBtn">🙈 Hide</button>
          <button class="btn-ghost removeBtn">Hang up</button>
        </div>
      `;
      grid.appendChild(tile);
      tiles[c.id] = tile;
      connectPreview(c.id);

      tile.querySelector('.goLiveBtn').onclick = () => socket.emit('go-live', { callerId: c.id });
      tile.querySelector('.stopBtn').onclick = () => socket.emit('stop-live', { callerId: c.id });
      tile.querySelector('.removeBtn').onclick = () => socket.emit('remove-caller', { callerId: c.id });

      tile.querySelector('.unmuteBtn').onclick = (ev) => {
        const video = tile.querySelector('video');
        video.muted = !video.muted;
        ev.target.textContent = video.muted ? '🔇 Unmute preview' : '🔊 Mute preview';
      };

      tile.querySelector('.toggleMicBtn').onclick = (ev) => {
        const nowOn = ev.target.dataset.on !== 'true';
        ev.target.dataset.on = String(nowOn);
        ev.target.textContent = '🎙️ Mic: ' + (nowOn ? 'On' : 'Off');
        socket.emit('set-caller-media', { callerId: c.id, audio: nowOn });
      };

      tile.querySelector('.toggleCamBtn').onclick = (ev) => {
        const nowOn = ev.target.dataset.on !== 'true';
        ev.target.dataset.on = String(nowOn);
        ev.target.textContent = '📷 Cam: ' + (nowOn ? 'On' : 'Off');
        socket.emit('set-caller-media', { callerId: c.id, video: nowOn });
      };

      tile.querySelector('.msgBtn').onclick = () => {
        const text = prompt('Private message to ' + c.name + ':');
        if (text && text.trim()) {
          socket.emit('private-message', { callerId: c.id, text: text.trim() });
        }
      };

      tile.querySelector('.talkBtn').onclick = (ev) => toggleTalkback(c.id, ev.target);

      tile.querySelector('.renameBtn').onclick = () => {
        const newName = prompt('New label for this caller:', tile.querySelector('.callerNameLabel').textContent);
        if (newName && newName.trim()) {
          socket.emit('rename-caller', { callerId: c.id, name: newName.trim() });
        }
      };

      tile.querySelector('.linkBtn').onclick = (ev) => {
        const url = location.origin + '/dj.html?only=' + encodeURIComponent(c.id);
        navigator.clipboard.writeText(url).then(() => {
          ev.target.textContent = '✅ Copied!';
          setTimeout(() => { ev.target.textContent = '🔗 Copy solo link'; }, 2000);
        }).catch(() => {
          prompt('Copy this link:', url);
        });
      };

      tile.querySelector('.hideBtn').onclick = (ev) => {
        const video = tile.querySelector('video');
        const isHidden = video.style.visibility === 'hidden';
        video.style.visibility = isHidden ? 'visible' : 'hidden';
        ev.target.textContent = isHidden ? '🙈 Hide' : '👁️ Show';
      };
    }

    // update live state UI
    const nameLabel = tile.querySelector('.callerNameLabel');
    if (nameLabel.textContent !== c.name) nameLabel.textContent = c.name;
    const dot = tile.querySelector('.dot');
    const statusText = tile.querySelector('.statusText');
    const goLiveBtn = tile.querySelector('.goLiveBtn');
    const stopBtn = tile.querySelector('.stopBtn');
    if (c.live) {
      tile.classList.add('live-tile');
      dot.classList.add('live');
      statusText.textContent = 'LIVE';
      goLiveBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
    } else {
      tile.classList.remove('live-tile');
      dot.classList.remove('live');
      statusText.textContent = 'waiting';
      goLiveBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
    }
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

socket.on('waiting-list', renderList);

document.getElementById('broadcastBtn').onclick = () => {
  const input = document.getElementById('broadcastInput');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('broadcast-message', { text });
  input.value = '';
};
document.getElementById('broadcastInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('broadcastBtn').click();
});
</script>
</body>
</html>
