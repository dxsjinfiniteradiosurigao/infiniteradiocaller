<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Screen - On Air</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>🎧 DJ Screen</h1>
  <div class="subtitle">This screen shows whoever the tech pushes live. Keep this tab open.</div>

  <div class="dj-stage">
    <div class="stage-wrap" id="stageWrap">
      <div class="waiting-screen" id="waitingScreen">
        <div style="font-size:2.4rem; margin-bottom:8px;">📻</div>
        <div>Waiting for a caller to go live...</div>
      </div>
      <video id="liveVideo" autoplay playsinline style="display:none;"></video>
      <div class="caller-badge" id="callerBadge" style="display:none;"></div>
      <div id="audioMeterWrap" style="display:none; position:absolute; bottom:16px; left:16px; right:16px;">
        <div style="height:8px; background:rgba(255,255,255,0.15); border-radius:4px; overflow:hidden;">
          <div id="djAudioMeter" style="height:100%; width:0%; background:#2ecc71; transition:width 0.1s;"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="unlockOverlay" class="card" style="text-align:center; margin-top:20px;">
    <div style="margin-bottom:10px;">🔊 Click below once so this tab is allowed to play caller audio.</div>
    <button class="btn-primary" id="unlockBtn">Enable Audio for This Screen</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/rtc-config.js"></script>
<script>
const socket = io();
socket.emit('register', { role: 'dj' });

const onlyCallerId = new URLSearchParams(location.search).get('only');

let resolvedRtcConfig = null;
RTC_CONFIG_PROMISE.then((cfg) => { resolvedRtcConfig = cfg; });
async function getRtc() { if (!resolvedRtcConfig) resolvedRtcConfig = await RTC_CONFIG_PROMISE; return resolvedRtcConfig; }
let currentPC = null;
let currentCallerId = null;
let audioUnlocked = false;

document.getElementById('unlockBtn').onclick = () => {
  audioUnlocked = true;
  const video = document.getElementById('liveVideo');
  video.muted = false;
  video.play().catch(() => {});
  document.getElementById('unlockOverlay').style.display = 'none';
};

function setupDjMeter(stream) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    document.getElementById('audioMeterWrap').style.display = 'block';
    function tick() {
      if (stream !== currentStream) return; // stop when call ends/changes
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      document.getElementById('djAudioMeter').style.width = Math.min(100, avg * 1.5) + '%';
      requestAnimationFrame(tick);
    }
    tick();
  } catch (e) { /* ignore */ }
}

let currentStream = null;

async function connectToCaller(callerId, name) {
  cleanupCurrent();
  currentCallerId = callerId;

  const pc = new RTCPeerConnection(await getRtc());
  currentPC = pc;

  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.addTransceiver('video', { direction: 'recvonly' });

  pc.onconnectionstatechange = () => {
    const badge = document.getElementById('callerBadge');
    if (pc.connectionState !== 'connected') {
      badge.style.display = 'block';
      badge.textContent = '🔴 ' + name + ' — ' + friendlyIceStatus(pc.connectionState);
    }
  };

  pc.ontrack = (e) => {
    const video = document.getElementById('liveVideo');
    const stream = e.streams[0];
    currentStream = stream;
    video.srcObject = stream;
    video.muted = !audioUnlocked;
    video.style.display = 'block';
    video.play().catch(() => {});
    document.getElementById('waitingScreen').style.display = 'none';
    document.getElementById('callerBadge').style.display = 'block';
    document.getElementById('callerBadge').textContent = '🔴 ' + name;
    if (stream.getAudioTracks().length) setupDjMeter(stream);
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('signal', { to: callerId, data: { type: 'candidate', candidate: e.candidate } });
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('signal', { to: callerId, data: { type: 'offer', sdp: offer } });
}

function cleanupCurrent() {
  if (currentPC) { currentPC.close(); currentPC = null; }
  currentCallerId = null;
  currentStream = null;
  const video = document.getElementById('liveVideo');
  video.srcObject = null;
  video.style.display = 'none';
  document.getElementById('callerBadge').style.display = 'none';
  document.getElementById('audioMeterWrap').style.display = 'none';
  document.getElementById('waitingScreen').style.display = 'block';
}

socket.on('signal', async ({ from, data }) => {
  if (!currentPC || from !== currentCallerId) return;
  if (data.type === 'answer') {
    await currentPC.setRemoteDescription(new RTCSessionDescription(data.sdp));
  } else if (data.type === 'candidate') {
    try { await currentPC.addIceCandidate(data.candidate); } catch (e) {}
  }
});

socket.on('incoming-call', ({ callerId, name }) => {
  if (onlyCallerId && callerId !== onlyCallerId) return; // solo view: ignore other callers
  connectToCaller(callerId, name);
});

socket.on('call-ended', ({ callerId }) => {
  if (callerId === currentCallerId) cleanupCurrent();
});
</script>
</body>
</html>
